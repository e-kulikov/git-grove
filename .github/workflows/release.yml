name: release

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  release:
    name: Verify and publish static Linux release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CARGO_TERM_COLOR: always
      BUILD_TOOLCHAIN: "1.97.1"
      MSRV_TOOLCHAIN: "1.85.1"
      TARGET: x86_64-unknown-linux-musl
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v6

      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/validate-release-version.sh "$GITHUB_REF_NAME" Cargo.toml)
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Install Git and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends file fish git musl-tools zsh
          git version

      - name: Install locked Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$BUILD_TOOLCHAIN" \
            --profile default \
            --component rustfmt,clippy \
            --target "$TARGET"
          rustup toolchain install "$MSRV_TOOLCHAIN" --profile minimal

      - name: Verify the minimum supported Rust version
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$MSRV_TOOLCHAIN" check --all-targets --locked

      - name: Format, test, and lint
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$BUILD_TOOLCHAIN" fmt --all -- --check
          cargo "+$BUILD_TOOLCHAIN" test --all-targets --locked
          cargo "+$BUILD_TOOLCHAIN" clippy --all-targets --locked -- -D warnings

      - name: Build static musl binary
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$BUILD_TOOLCHAIN" build --release --locked --target "$TARGET"
          binary="target/$TARGET/release/git-grove"
          file "$binary" | grep -F 'statically linked'
          if readelf -l "$binary" | grep -Fq 'INTERP'; then
            echo 'release binary has a dynamic interpreter' >&2
            exit 1
          fi
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Build deterministic archive and checksum
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The commit timestamp is stable for a tag and avoids filesystem mtimes.
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/package-release.sh \
            "$VERSION" \
            "target/$TARGET/release/git-grove" \
            dist

      - name: Verify packaged installation contract
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          stage="git-grove_${VERSION}_linux_x86_64"
          archive="$stage.tar.gz"
          (
            cd dist
            sha256sum --check SHA256SUMS
          )
          temp=$(mktemp -d)
          trap 'rm -rf -- "$temp"' EXIT
          tar -xzf "dist/$archive" -C "$temp"
          binary="$temp/$stage/git-grove"
          test -x "$binary"
          file "$binary" | grep -F 'statically linked'
          if readelf -l "$binary" | grep -Fq 'INTERP'; then
            echo 'packaged binary has a dynamic interpreter' >&2
            exit 1
          fi
          "$binary" --version | grep -Fx "git-grove $VERSION"
          "$binary" --help >/dev/null
          bash -n "$temp/$stage/completions/git-grove.bash"
          zsh -n "$temp/$stage/completions/_git-grove"
          fish --no-execute "$temp/$stage/completions/git-grove.fish"
          "$binary" init --branch main "$temp/smoke-grove"
          (
            cd "$temp/smoke-grove"
            "$binary" list >/dev/null
          )

      - name: Attest release files
        uses: actions/attest@v4
        with:
          subject-path: "dist/*"

      - name: Create GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists; refusing to overwrite it" >&2
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" \
            "dist/git-grove_${VERSION}_linux_x86_64.tar.gz" \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "git-grove $VERSION" \
            --generate-notes

[package]
name = "git-grove"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Manage repositories as a bare clone surrounded by git worktrees"
license = "MIT"

[dependencies]
anstream = "0.6"
anstyle = "1"
anyhow = "1"
bstr = "1"
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
getrandom = "0.2"
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
strip = true
lto = true

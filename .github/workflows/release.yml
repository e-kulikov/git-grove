name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing draft release tag to build and publish again (recovery)
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR and draft release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ inputs.tag || steps.rp.outputs.tag_name }}
      publish: ${{ inputs.tag != '' || steps.rp.outputs.release_created == 'true' }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    name: Verify the release
    needs: release-please
    if: needs.release-please.outputs.publish == 'true'
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read

  build:
    name: Build ${{ matrix.target }}
    needs: [release-please, verify]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-latest
            arch: x86_64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: aarch64
    env:
      CARGO_TERM_COLOR: always
      BUILD_TOOLCHAIN: "1.97.1"
      TARGET: ${{ matrix.target }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          persist-credentials: false

      - name: Validate tag and package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(scripts/validate-release-version.sh "$TAG" Cargo.toml)
          printf 'version=%s\n' "$version" >>"$GITHUB_OUTPUT"

      - name: Install Git and build prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends file fish git musl-tools zsh
          git version

      - name: Install locked Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install "$BUILD_TOOLCHAIN" \
            --profile default \
            --target "$TARGET"

      - name: Build static musl binary
        shell: bash
        run: |
          set -euo pipefail
          cargo "+$BUILD_TOOLCHAIN" build --release --locked --target "$TARGET"
          binary="target/$TARGET/release/git-grove"
          file "$binary"
          if readelf -l "$binary" | grep -Fq 'INTERP'; then
            echo 'release binary has a dynamic interpreter' >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -Fq 'NEEDED'; then
            echo 'release binary has a dynamic dependency' >&2
            exit 1
          fi
          "$binary" --version
          "$binary" --help >/dev/null

      - name: Build deterministic archive
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # The commit timestamp is stable for a tag and avoids filesystem mtimes.
          SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)
          export SOURCE_DATE_EPOCH
          scripts/package-release.sh \
            "$VERSION" \
            "$TARGET" \
            "target/$TARGET/release/git-grove" \
            dist

      # Each target builds on a runner of its own architecture, so the packaged
      # binary is executed natively below for both x86_64 and aarch64.
      - name: Verify packaged installation contract
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          stage="git-grove_${VERSION}_linux_${ARCH}"
          archive="$stage.tar.gz"
          temp=$(mktemp -d)
          trap 'rm -rf -- "$temp"' EXIT
          tar -xzf "dist/$archive" -C "$temp"
          binary="$temp/$stage/git-grove"
          test -x "$binary"
          file "$binary"
          if readelf -l "$binary" | grep -Fq 'INTERP'; then
            echo 'packaged binary has a dynamic interpreter' >&2
            exit 1
          fi
          if readelf -d "$binary" | grep -Fq 'NEEDED'; then
            echo 'packaged binary has a dynamic dependency' >&2
            exit 1
          fi
          "$binary" --version | grep -Fx "git-grove $VERSION"
          "$binary" --help >/dev/null
          bash -n "$temp/$stage/completions/git-grove.bash"
          zsh -n "$temp/$stage/completions/_git-grove"
          fish --no-execute "$temp/$stage/completions/git-grove.fish"

          # Packaged flat-repository adopt smoke: preserve exact status/index
          # evidence and content, create the default/payload worktree, and prove
          # the shipped featureless binary ignores the test-only failpoint.
          flat="$temp/flat"
          git init --quiet --initial-branch=main "$flat"
          git -C "$flat" config user.email test@example.invalid
          git -C "$flat" config user.name Test
          echo base >"$flat/tracked"
          git -C "$flat" add tracked
          git -C "$flat" commit --quiet -m base
          echo modified >"$flat/tracked"
          echo staged >"$flat/staged"
          git -C "$flat" add staged
          echo untracked >"$flat/untracked"
          before_status=$(git -C "$flat" status --porcelain=v2 -z --branch --untracked-files=all | sha256sum)
          before_index=$(git -C "$flat" ls-files --stage -z | sha256sum)
          GIT_GROVE_FAILPOINT=error:1 "$binary" adopt "$flat"
          test -d "$flat/.bare"
          test "$(cat "$flat/.git")" = 'gitdir: ./.bare'
          test "$(cat "$flat/main/tracked")" = modified
          test "$(cat "$flat/main/staged")" = staged
          test "$(cat "$flat/main/untracked")" = untracked
          after_status=$(git -C "$flat/main" status --porcelain=v2 -z --branch --untracked-files=all | sha256sum)
          after_index=$(git -C "$flat/main" ls-files --stage -z | sha256sum)
          test "$before_status" = "$after_status"
          test "$before_index" = "$after_index"
          test "$(git -C "$flat/main" branch --show-current)" = main

          # Packaged local-remote sync smoke: clone, advance from a peer,
          # sync, and verify the worktree fast-forwarded. Local temporary
          # repositories only; no network access.
          origin="$temp/origin.git"
          git init --quiet --bare --initial-branch=main "$origin"
          seed="$temp/seed"
          git clone --quiet "$origin" "$seed"
          git -C "$seed" config user.email test@example.invalid
          git -C "$seed" config user.name Test
          echo seed >"$seed/README.md"
          git -C "$seed" add README.md
          git -C "$seed" commit --quiet -m seed
          git -C "$seed" push --quiet origin main

          grove="$temp/grove"
          "$binary" clone "$origin" "$grove"

          peer="$temp/peer"
          git clone --quiet "$origin" "$peer"
          git -C "$peer" config user.email test@example.invalid
          git -C "$peer" config user.name Test
          echo advance >"$peer/advance.txt"
          git -C "$peer" add advance.txt
          git -C "$peer" commit --quiet -m advance
          git -C "$peer" push --quiet origin main

          (
            cd "$grove"
            "$binary" sync
          )
          worktree_head=$(git -C "$grove/main" rev-parse HEAD)
          peer_head=$(git -C "$peer" rev-parse HEAD)
          if [[ "$worktree_head" != "$peer_head" ]]; then
            echo 'packaged sync did not fast-forward the worktree to the peer-advanced tip' >&2
            exit 1
          fi
          test -f "$grove/main/advance.txt"

          # Packaged local-remote publish smoke: init a second grove, commit in
          # its worktree, publish it to a fresh empty origin, and verify the
          # origin's default branch and HEAD. Local temporary repositories
          # only; no network access.
          empty_origin="$temp/empty-origin.git"
          git init --quiet --bare --initial-branch=main "$empty_origin"

          published="$temp/published"
          "$binary" init "$published" --branch main
          git -C "$published/main" config user.email test@example.invalid
          git -C "$published/main" config user.name Test
          echo published >"$published/main/PUBLISHED.md"
          git -C "$published/main" add PUBLISHED.md
          git -C "$published/main" commit --quiet -m publish

          (
            cd "$published"
            "$binary" publish "$empty_origin"
          )
          published_head=$(git -C "$published/main" rev-parse HEAD)
          origin_head=$(git --git-dir="$empty_origin" rev-parse refs/heads/main)
          if [[ "$published_head" != "$origin_head" ]]; then
            echo 'packaged publish did not push the default branch to the origin' >&2
            exit 1
          fi
          origin_symref=$(git --git-dir="$empty_origin" symbolic-ref HEAD)
          if [[ "$origin_symref" != 'refs/heads/main' ]]; then
            echo "packaged publish left the origin HEAD at $origin_symref" >&2
            exit 1
          fi

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    needs: [release-please, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - name: Check out the release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

      - name: Download every target's archive
        uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        shell: bash
        run: |
          set -euo pipefail
          sha256sum ./*.tar.gz | sed 's# \./# #' >SHA256SUMS
          sha256sum --check SHA256SUMS

      - name: Attest release files
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/SHA256SUMS

      - name: Upload the assets to the draft release
        shell: bash
        run: |
          set -euo pipefail
          gh release upload "$TAG" dist/*.tar.gz dist/SHA256SUMS --clobber

      - name: Verify the uploaded assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir verify
          gh release download "$TAG" --dir verify
          (cd verify && sha256sum --check SHA256SUMS)
          archives=(verify/*.tar.gz)
          test "${#archives[@]}" -eq 2

      - name: Publish the release
        shell: bash
        run: |
          set -euo pipefail
          gh release edit "$TAG" --draft=false --latest

      - name: Fast-forward stable
        shell: bash
        run: |
          set -euo pipefail
          sha=$(git rev-list -n1 "$TAG")
          git fetch origin stable || true
          if git rev-parse --verify --quiet origin/stable >/dev/null &&
            ! git merge-base --is-ancestor origin/stable "$sha"; then
            echo "stable is not an ancestor of $TAG; refusing to move it" >&2
            exit 1
          fi
          git push origin "$sha:refs/heads/stable"

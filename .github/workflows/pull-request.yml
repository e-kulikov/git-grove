name: pull request

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  verify:
    name: Verify
    # release-please's own PR carries nothing but the version/changelog bump
    # release-please-action itself computed; release.yml re-verifies that
    # exact commit under its own "Verify the release" job once the PR merges
    # and publish is possible, so running the full suite here too is pure
    # duplication, not an extra safety check.
    if: >-
      !startsWith(github.event.pull_request.head.ref, 'release-please--')
      && (contains(fromJSON('["OWNER","MEMBER","COLLABORATOR","CONTRIBUTOR"]'),
                   github.event.pull_request.author_association)
          || contains(github.event.pull_request.labels.*.name, 'safe-to-test'))
    uses: ./.github/workflows/verify.yml
    permissions:
      contents: read
    concurrency:
      # Shared with release.yml's "Verify the release" job: if the exact
      # same commit is (or becomes, after merge) verified by both workflows
      # while one is still running, the newer trigger wins rather than both
      # running to completion.
      group: verify-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: true

  checks:
    name: Pull request checks
    needs: verify
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Report a definite conclusion
        shell: bash
        env:
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          result="${{ needs.verify.result }}"
          echo "verify result: $result"
          case "$result" in
            success)
              exit 0
              ;;
            skipped)
              if [[ "${{ startsWith(github.event.pull_request.head.ref, 'release-please--') }}" == true ]]; then
                echo "verify was skipped: this is release-please's own branch ($HEAD_REF); release.yml verifies that commit instead, once merging makes a release possible"
              else
                echo "verify was skipped: author association '${{ github.event.pull_request.author_association }}' is outside the trusted set (OWNER, MEMBER, COLLABORATOR, CONTRIBUTOR) and this pull request is not labelled safe-to-test"
              fi
              exit 0
              ;;
            *)
              echo "verify did not succeed: $result" >&2
              exit 1
              ;;
          esac
